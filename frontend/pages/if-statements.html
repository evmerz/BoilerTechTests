<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="/frontend/styles/navigation.css">
    <link rel="stylesheet" href="/frontend/styles/global.css">
    <link rel="stylesheet" href="/frontend/styles/quiz.css">
    <title>CS240 Quiz</title>
    <style>
        .correct {
            color: #20b625; /* Light green for correct user answers */
            font-weight: bold;
        }
        
        .incorrect {
            color: #f44336; /* Red for incorrect user answers */
            font-weight: bold;
        }
        
        .correct-answer {
            color: #87cf8b; /* Light green for the correct answer line */
            font-weight: bold;
        }
    </style> 
</head>
<body>
    <div id="navbar-load"></div>
    <div class="container">
        <div class="sub-container">
            <h1 id="quiz-title" style="text-align: center;">CS240 Quiz</h1>
            <div id="quiz-container">
                <button id="back-button" class="button">Back to Practice</button>
                <div id="quiz-contents"></div>
                <p id="answer-message" style="color: #931b1b; display: none;">You need to answer all questions before you can submit.</p>
            </div>
        </div>
    </div>
    <script src="/frontend/scripts/quiz.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
    <script src="/frontend/scripts/navigation.js"></script>
</body>
<script>
    document.getElementById('back-button').addEventListener('click', function() {
        window.location.href = '/frontend/pages/cs240.html'; // Update the path if needed
    });
</script>
<script src="/frontend/scripts/quiz.js"></script>
<script>
    // Initialize the quiz upon load
    window.addEventListener("DOMContentLoaded", async function () {
        const params = new URLSearchParams(location.search);
        quizID = params.get("quiz-id");
        console.log(quizID);

        quizData = await loadQuizData(quizID);

        userAnswers = new Array(quizData.questions.length).fill(null);
        quizContainer = document.getElementById("quiz-contents");

        renderQuestion();
    });
</script>
</html>
