<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link rel="stylesheet" href="/frontend/styles/navigation.css">
    <link rel="stylesheet" href="/frontend/styles/home.css">
    <link rel="stylesheet" href="/frontend/styles/global.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <script src="/frontend/scripts/quiz-load.js"></script>

    <title>CS240 - BoilerTechTests</title>
</head>

<body>
    <div id="navbar-load"></div>

    <div class="container">
        <div id="spacer"></div>

        <div class="sub-container">
            <h2>CS240</h2>

            <div style="margin-bottom: 20px;">
                <button id="back-to-practice" class="button">Back to Practice</button>
            </div>

            <!-- Exam and topic container where topics will be dynamically loaded -->
            <div id="exam-sections" class="content-panel">
                <!-- JavaScript will inject exam sections and topic buttons here -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
    <script src="/frontend/scripts/navigation.js"></script>
    <script src="/frontend/scripts/project-load.js"></script>
    <script src="/frontend/scripts/quiz.js"></script>

    <script>

        document.getElementById("back-to-practice").addEventListener("click", function () {
            window.location.href = "/frontend/pages/cs240.html";
        });
        // Data for CS240 page
        const cs240Data = {
            exams: [
                {
                    title: "SELECT AN EXAM 1 TOPIC TO STUDY",
                    topics: [
                        { name: "Topic 1 - if-statements", id: "if-statements" },
                        { name: "Topic 2 - for-loops", id: "for-loops" }
                    ]
                }
            ]
        };

        function promiseState(p) {
        const t = {};
        return Promise.race([p, t])
            .then(v => (v === t)? "pending" : "fulfilled", () => "rejected");
        }

        // Function to load CS240 exam sections and topics
        function loadCS240Content() {
            const examContainer = document.getElementById("exam-sections");

            cs240Data.exams.forEach(exam => {
                // Create exam title
                const examTitle = document.createElement("h3");
                examTitle.textContent = exam.title;
                examContainer.appendChild(examTitle);

                // Create topic buttons for each exam
                exam.topics.forEach(topic => {
                    const fade = document.createElement("div");

                    const panel = document.createElement("div");
                    panel.classList.add("project-panel");

                    const text = document.createElement("div");
                    text.classList.add("caption");

                    const button = document.createElement("a");
                    button.classList.add("button");
                    button.textContent = topic.name;

                    // Set the click event for the button
                    button.addEventListener('click', async function() {
                        const topicKey = topic.id;
                        const quizID = await getQuizID(topic.id);
                        console.log("DEBUG quizID:", quizID);
                        const userID = localStorage.getItem('userId');

                        // If the user is logged in
                        if (userID) {

                            const submissionData = await getSubmission(userID, quizID);
                            console.log("submissiondata", submissionData);

                            if (submissionData) {
                                // Store the submission data in local storage and go to results page
                                localStorage.setItem(`quiz_${quizID}`, submissionData);
                                window.location.href = `/frontend/pages/results.html?quiz-id=${quizID}`;

                            } else {
                                // No previous submission, so proceed to the quiz page
                                window.location.href = `/frontend/pages/if-statements.html?quiz-id=${quizID}&class-id=cs240-exam1`;
                            }
                        } else {
                            // window.location.href = `./${topic.id}.html?quiz-id=${quizID}`;
                            window.location.href = `/frontend/pages/if-statements.html?quiz-id=${quizID}&class-id=cs240-exam1`;
                        }

                        // if (quizTaken) {
                        //     // Redirect to results page if quiz was already taken
                        //     window.location.href = '/frontend/pages/results.html'; // Update the path if needed
                        // } else {
                        //     // First time clicking, redirect to quiz page
                        //     window.location.href = `./${topic.id}.html?quiz-id=${quizID}`; // Link to topic-specific quiz page
                        // }
                        // help
                    });

                    text.appendChild(button);
                    panel.appendChild(text);
                    fade.appendChild(panel);

                    examContainer.appendChild(fade);
                });
            });
        }

        // Load CS240 content on page load
        $(document).ready(loadCS240Content);
    </script>
</body>
</html>
