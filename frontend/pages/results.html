<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="/frontend/styles/navigation.css">
    <link rel="stylesheet" href="/frontend/styles/global.css">
    <link rel="stylesheet" href="/frontend/styles/quiz.css">
    <title>Quiz Results</title>
    <style>
        .correct {
            color: #48a43f; /* Light green for correct user answers */
            font-weight: bold;
        }
        
        .incorrect {
            color: #931b1b; /* Red for incorrect user answers */
            font-weight: bold;
        }
        
        .correct-answer {
            color:#207318; /* Light green for the correct answer line */
            font-weight: bold;
        }

        /* Add the button styling from the quiz page */
        .button {
            padding: 10px 20px;
            background-color: #000000; /* Primary color */
            color: white; /* Text color */
            text-align: center;
            text-decoration: none; /* No underline */
            border: none; /* No border */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Pointer on hover */
            display: inline-block; /* Inline block element */
            margin-top: 20px; /* Spacing above the button */
            font-size: 16px; /* Font size */
            transition: background-color 0.3s; /* Smooth transition for hover */
        }
        
        .button:hover {
            background-color: #424242; /* Darker shade on hover */
        }
    </style> 
</head>
<body>
    <div id="navbar-load"></div>
    <div class="container">
        <div class="sub-container">
            <h1 id="results-title" style="text-align: center;">Quiz Results</h1>
            <div id="results-contents"></div>
            <!-- Updated button structure to match the quiz page -->
            <div id="quiz-container">
                <button id="back-button" class="button">Back to Practice</button>
                <button id="retake-button" class="button">Retake Quiz</button> <!-- New Retake Quiz button -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
    <script src="/frontend/scripts/navigation.js"></script>
    <script src="/frontend/scripts/quiz.js"></script> 

    <script>
        // This script should receive results data from the quiz page.
        // You can either pass it through localStorage, sessionStorage or URL parameters.

        const params = new URLSearchParams(location.search);
        quizID = params.get("quiz-id");

        const results = JSON.parse(localStorage.getItem('quiz_' + quizID)) || [];

        const quizData = await loadQuizData(quizID);

        // Display the results of the quiz
        const resultsContainer = document.getElementById('results-contents');
        
        var resultContents, userScore, maxScore;
        
        results.forEach((result, index) => {

            for (var question of quizData.questions) {
                if (result.questionID != question.questionID) continue;
                
                // Get the text for the user response and the correct answer
                var userAnswerText, correctAnswerText;
                for (option of question.options) {
                    if (result.answerID == option.optionID) userAnswerText = option.text;

                    if (question.answerID == option.optionID) correctAnswerText = option.text;
                    
                    if (userAnswerText && correctAnswerText) break;
                }

                const correct = (result.answerID == question.answerID);

                userScore += correct ? question.points : 0;
                maxScore += question.points;
                
                const correctnessLabel = correct ? "(Correct)" : "(Incorrect)";
                resultContents += `
                    <div class="question">
                        <p>Question ${index + 1}: ${question.question}</p>
                        <p class="${correct ? 'correct' : 'incorrect'}">
                            Your answer: ${userAnswerText || 'No answer selected'} ${correctnessLabel}
                        </p>
                        <p class="correct-answer">Correct answer: ${correctAnswerText}</p>
                        <p>Score: ${correct ? question.points : 0}</p>
                    </div>
                `;
                    
                break;
            }
        });
            
        resultsContainer.innerHTML = `<h2>Total Score: ${userScore}/${maxScore}</h2>`;
        resultsContainer.innerHTML += resultContents; // Append the formatted results

        document.getElementById('back-button').addEventListener('click', function() {
            window.location.href = '/frontend/pages/cs240.html'; // Update the path if needed
        });

        document.getElementById('retake-button').addEventListener('click', async function() {
            const topicKey = 'if-statements'; // Adjust based on topic
            const quizID = await getQuizID(topicKey);
            sessionStorage.removeItem('quizResults');
            sessionStorage.removeItem(`${topicKey}Taken`);
            
            // Redirect back to the quiz page
            window.location.href = `./${topicKey}.html?quiz-id=${quizID}`;
        });

    </script>
</body>
</html>
